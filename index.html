const transitionButtons=[...transitionCard.querySelectorAll('[data-transition]')];
transitionButtons.forEach(b=>b.onclick=()=>{if(transitionBusy)return;transitionChoice=b.dataset.transition;stage.dataset.camera=String(transitionChoice==='camera');focusFrame.style.opacity='0';transitionButtons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
function playTransition(button,toDestination,point){

const core=overlay.querySelector('.diffusion-core'),rings=[...overlay.querySelectorAll('.ripple-ring')];rings.forEach(p=>p.style.display='none');

const grow=reduced?1:(camera?760:bouncy?1200:1100),hold=reduced?0:(camera?120:50),fade=reduced?100:(camera?360:500),reveal=reduced?100:(camera?450:650),total=grow+hold+Math.max(fade,reveal+120),started=performance.now(),heading=destinationPage.querySelector('h3');let swapped=false;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};

function frame(now){if(run!==transitionRun)return;const e=now-started,t=clamp(e/grow,0,1),radius=1+full*(bouncy?bounce(t):1-Math.pow(1-t,2));stage.dataset.elapsed=String(Math.round(e));stage.dataset.radius=String(radius);core.setAttribute('d',outline(radius,t,ripple));rings.forEach((p,i)=>{const lag=(i+1)*.13,rt=clamp((t-lag)/(1-lag),0,1),r=1+full*(1-Math.pow(1-rt,2));p.setAttribute('d',outline(r,t+i*.4,true));p.style.opacity=String(rt>0?.42*Math.sin(rt*Math.PI):0);});

if(e>=grow&&!swapped){swapped=true;sourcePage.hidden=toDestination;destinationPage.hidden=!toDestination;sourcePage.inert=toDestination;destinationPage.inert=!toDestination;if(toDestination){heading.style.opacity=back.style.opacity='0';}}
if(e>=grow+hold){if(camera){const incoming=toDestination?destinationPage:sourcePage,develop=smooth((e-grow-hold)/450);incoming.style.filter=`blur(${(1-develop)*7}px)`;incoming.style.opacity=String(.4+.6*develop);}stage.dataset.phase='reveal';const local=e-grow-hold;overlay.style.opacity=String(1-smooth(local/fade));if(toDestination){const ht=smooth((local-(camera?60:100))/reveal),bt=smooth((local-(camera?140:220))/(reveal-(camera?60:100)));heading.style.opacity=String(ht);back.style.opacity=String(bt);heading.style.transform=`translateY(${(1-ht)*16}px)`;back.style.transform=`translateY(${(1-bt)*10}px)`;stage.dataset.textOpacity=String(ht);}}
if(e>=total){overlay.style.visibility='hidden';overlay.style.opacity='0';overlay.style.filter='';sourcePage.style.filter=destinationPage.style.filter='';sourcePage.style.opacity=destinationPage.style.opacity='';stage.dataset.busy='false';stage.dataset.phase='idle';transitionBusy=false;transitionButtons.forEach(b=>b.disabled=false);heading.style.opacity=back.style.opacity='1';heading.style.transform=back.style.transform='translateY(0)';(toDestination?back:learn).focus({preventScroll:true});return;}requestAnimationFrame(frame);}

}

const focusFrame=document.createElement('div');focusFrame.className='camera-focus';focusFrame.setAttribute('aria-hidden','true');stage.append(focusFrame);let focusPending=false;

async function triggerTransition(button,toDestination,event){if(transitionBusy||focusPending)return;const rect=button.getBoundingClientRect(),point=event&&event.detail!==0?{x:event.clientX,y:event.clientY}:{x:rect.left+rect.width/2,y:rect.top+rect.height/2};if(transitionChoice==='camera'){focusPending=true;stage.dataset.phase='focus';stage.dataset.busy='true';transitionButtons.forEach(b=>b.disabled=true);positionFocus(point);focusFrame.style.opacity='1';focusFrame.style.transform='translate(-50%,-50%) scale(1)';const press=button.animate([{transform:'scale(1)',boxShadow:'inset 0 0 0 0 transparent'},{transform:'scale(.94)',boxShadow:'inset 0 3px 9px #743a2440',offset:.45},{transform:'scale(1)',boxShadow:'inset 0 0 0 0 transparent'}],{duration:reduced?1:160});const focus=focusFrame.animate([{transform:'translate(-50%,-50%) scale(1.12)'},{transform:'translate(-50%,-50%) scale(.84)',offset:.7},{transform:'translate(-50%,-50%) scale(.88)'}],{duration:reduced?1:180,fill:'forwards'});await focus.finished;press.cancel();focus.cancel();focusFrame.style.opacity='0';focusPending=false;}playTransition(button,toDestination,transitionChoice==='camera'?point:undefined);}
learn.onclick=event=>triggerTransition(learn,true,event);back.onclick=event=>triggerTransition(back,false,event);destinationPage.inert=true;

window.pubboTransition={stage,sourcePage,destinationPage,overlay,play:()=>triggerTransition(learn,true),back:()=>triggerTransition(back,false)};
const navTargets=[...modules.map(m=>m.card),transitionCard];

const navButtons=[...document.querySelectorAll('.mode')];
const mobileBar=document.querySelector('.mobile-nav'),trigger=document.querySelector('#mobile-trigger'),menu=document.querySelector('#mobile-menu'),options=[...document.querySelectorAll('.mobile-option')];
function setCurrent(index){selected=index;navButtons.forEach((button,i)=>button.setAttribute('aria-current',i===index));options.forEach((button,i)=>button.setAttribute('aria-selected',i===index));document.querySelector('#mobile-current').textContent=String(index+1).padStart(2,'0')+'　'+navButtons[index].querySelector('strong').textContent;}
function closeMenu(restoreFocus=false){menu.hidden=true;trigger.setAttribute('aria-expanded','false');if(restoreFocus)trigger.focus({preventScroll:true});}
function jumpTo(index){closeMenu();const offset=matchMedia('(max-width:700px)').matches?mobileBar.getBoundingClientRect().height+16:24;window.scrollTo({top:Math.max(0,window.scrollY+navTargets[index].getBoundingClientRect().top-offset),behavior:reduced?'instant':'smooth'});}
navButtons.forEach((button,i)=>button.onclick=()=>jumpTo(i));options.forEach((button,i)=>button.onclick=()=>{jumpTo(i);trigger.focus({preventScroll:true})});
trigger.onclick=()=>{const open=trigger.getAttribute('aria-expanded')!=='true';menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open));};
trigger.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();menu.hidden=false;trigger.setAttribute('aria-expanded','true');options[selected].focus();}});
menu.addEventListener('keydown',e=>{const i=options.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();options[(i+(e.key==='ArrowDown'?1:-1)+options.length)%options.length].focus()}else if(e.key==='Home'){e.preventDefault();options[0].focus()}else if(e.key==='End'){e.preventDefault();options.at(-1).focus()}});
document.addEventListener('click',e=>{if(!mobileBar.contains(e.target))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden)closeMenu(true)});
let scrollFrame=0;function syncCurrent(){scrollFrame=0;const mobile=matchMedia('(max-width:700px)').matches;const probe=mobile?mobileBar.getBoundingClientRect().height+Math.min(innerHeight*.16,140)+16:Math.min(innerHeight*.24,240);let current=0;navTargets.forEach((card,i)=>{if(card.getBoundingClientRect().top<=probe)current=i});if(Math.ceil(scrollY+innerHeight)>=document.documentElement.scrollHeight-2)current=navTargets.length-1;if(current!==selected)setCurrent(current);}

setInterval(()=>{if(!document.querySelector('#auto').checked||document.hidden||reduced)return;modules.forEach((m,i)=>{if(!m.dragging&&performance.now()-m.interacted>4000)m.go(Math.round(m.target)+1)})},500);

</script></body></html>
